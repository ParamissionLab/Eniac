name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Structural checks, budget, compact coverage
        run: python scripts/check_skill.py
      - name: Generated adapters are up to date
        run: python scripts/build_adapters.py --check
      - name: Eval cases compile and discriminate
        run: python scripts/run_evals.py --self-test
